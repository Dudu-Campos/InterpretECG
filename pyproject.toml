[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretecg"
version = "0.1.0"
description = "Multi-view ECG representation experiments on PTB-XL"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pycatch22>=1.0.2",
    "PyWavelets>=1.6",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "wfdb>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mlp = ["torch>=2.5"]  # GPU: pip install torch --index-url https://download.pytorch.org/whl/cu126

[project.scripts]
catch22-baseline = "interpretecg.cli:main"
extract-views = "interpretecg.cli:extract_views"

[tool.setuptools.packages.find]
where = ["src"]
